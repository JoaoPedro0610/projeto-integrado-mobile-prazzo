<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1000" height="730" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">PRAZZO - Diagrama de Casos de Uso</text>

  <!-- Fronteira do sistema -->
  <rect x="200" y="60" width="600" height="650" fill="#f8f7ff" stroke="#4834d4" stroke-width="2" rx="6"/>
  <text x="500" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#4834d4">Sistema PRAZZO</text>

  <!-- Ator: Estudante -->
  <g stroke="#222" stroke-width="2" fill="none">
    <circle cx="90" cy="300" r="16"/>
    <line x1="90" y1="316" x2="90" y2="365"/>
    <line x1="60" y1="335" x2="120" y2="335"/>
    <line x1="90" y1="365" x2="65" y2="400"/>
    <line x1="90" y1="365" x2="115" y2="400"/>
  </g>
  <text x="90" y="425" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Estudante</text>

  <!-- Ator: Sistema de Notificacoes -->
  <g stroke="#222" stroke-width="2" fill="none">
    <circle cx="905" cy="580" r="16"/>
    <line x1="905" y1="596" x2="905" y2="645"/>
    <line x1="875" y1="615" x2="935" y2="615"/>
    <line x1="905" y1="645" x2="880" y2="680"/>
    <line x1="905" y1="645" x2="930" y2="680"/>
  </g>
  <text x="905" y="702" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Sistema de</text>
  <text x="905" y="720" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Notificações</text>

  <!-- Associacoes Estudante -> casos de uso -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="122" y1="330" x2="275" y2="130"/>
    <line x1="122" y1="335" x2="275" y2="210"/>
    <line x1="122" y1="340" x2="275" y2="290"/>
    <line x1="122" y1="345" x2="275" y2="370"/>
    <line x1="122" y1="350" x2="275" y2="455"/>
    <line x1="122" y1="355" x2="275" y2="560"/>
    <line x1="122" y1="360" x2="280" y2="650"/>
    <!-- Sistema de Notificacoes -> UC09 -->
    <line x1="875" y1="625" x2="485" y2="652"/>
  </g>

  <!-- Casos de uso -->
  <g fill="#ffffff" stroke="#6c5ce7" stroke-width="2">
    <ellipse cx="380" cy="130" rx="105" ry="30"/>
    <ellipse cx="380" cy="210" rx="105" ry="30"/>
    <ellipse cx="380" cy="290" rx="105" ry="30"/>
    <ellipse cx="380" cy="370" rx="105" ry="30"/>
    <ellipse cx="380" cy="455" rx="105" ry="30"/>
    <ellipse cx="380" cy="560" rx="105" ry="30"/>
    <ellipse cx="640" cy="350" rx="110" ry="30"/>
    <ellipse cx="640" cy="485" rx="110" ry="30"/>
    <ellipse cx="380" cy="650" rx="105" ry="30"/>
  </g>
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="380" y="126">UC01</text><text x="380" y="142">Cadastrar-se</text>
    <text x="380" y="206">UC02</text><text x="380" y="222">Fazer login</text>
    <text x="380" y="286">UC03</text><text x="380" y="302">Visualizar agenda</text>
    <text x="380" y="366">UC04</text><text x="380" y="382">Gerenciar disciplinas</text>
    <text x="380" y="451">UC05</text><text x="380" y="467">Gerenciar tarefas</text>
    <text x="380" y="556">UC06</text><text x="380" y="572">Concluir tarefa</text>
    <text x="640" y="346">UC07</text><text x="640" y="362">Vincular tarefa a disciplina</text>
    <text x="640" y="481">UC08</text><text x="640" y="497">Agendar lembrete</text>
    <text x="380" y="646">UC09</text><text x="380" y="662">Enviar lembrete de prazo</text>
  </g>

  <!-- UC07 <<extend>> UC05 -->
  <line x1="560" y1="372" x2="462" y2="435" stroke="#333" stroke-width="1.5" stroke-dasharray="7,5" marker-end="url(#seta)"/>
  <text x="530" y="415" font-size="12" font-style="italic" fill="#333">«extend»</text>

  <!-- UC05 <<include>> UC08 -->
  <line x1="480" y1="465" x2="530" y2="478" stroke="#333" stroke-width="1.5" stroke-dasharray="7,5" marker-end="url(#seta)"/>
  <text x="470" y="500" font-size="12" font-style="italic" fill="#333">«include»</text>
</svg>
